name: factory-build
# Fires when the maintainer adds design:approved to a design/issue-N PR.
on:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: >
      github.event.label.name == 'design:approved' &&
      github.event.sender.login == 'rahmansunny071' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'design/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: factory-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - id: issue
        run: echo "n=${HEAD_REF#design/issue-}" >> "$GITHUB_OUTPUT"
        env: { HEAD_REF: "${{ github.event.pull_request.head.ref }}" }
      # A design branch is written by the design agent, which may only add the design
      # file. Refuse to run code from it if it touches anything else (for example a
      # planted conftest.py from a prompt-injected issue). This is what makes it safe
      # to turn off the action's restrict_untrusted_prs below.
      - name: Design branch only changes .factory/designs/
        run: |
          git fetch --quiet origin "$BASE_REF"
          outside=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -v '^\.factory/designs/' || true)
          if [ -n "$outside" ]; then
            echo "::error::design branch changes files outside .factory/designs/:"
            echo "$outside"
            exit 1
          fi
        env: { BASE_REF: "${{ github.event.pull_request.base.ref }}" }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/build-from-design ${{ steps.issue.outputs.n }}"
          # Design PRs are authored by claude[bot], which the action can't confirm has
          # write access, so by default it denies running tests and linters. The guards
          # above (maintainer-only label, same-repo branch, design-only diff) cover it.
          restrict_untrusted_prs: "false"
          claude_args: >-
            --model sonnet
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(uv run --no-sync pytest:*),Bash(uvx ruff@0.17.4:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh label:*)"
