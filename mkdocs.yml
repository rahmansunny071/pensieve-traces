site_name: pensieve-traces
site_description: Turn coding-agent session traces and claude.ai chat exports into shareable traces and memory datasets.
site_url: https://rahmansunny071.github.io/pensieve-traces/
repo_url: https://github.com/rahmansunny071/pensieve-traces
repo_name: pensieve-traces
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/memory
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/lede.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Documentation:
      - Overview: index.md
      - Get started:
          - Install: getting-started/install.md
          - Convert Claude Code sessions: getting-started/claude-code.md
          - Convert a claude.ai export: getting-started/claude-ai.md
          - Build a ConvoMem dataset: getting-started/convomem-dataset.md
      - Concepts:
          - Canonical model: concepts/canonical-model.md
          - Readers: concepts/readers.md
          - Redaction and privacy: concepts/redaction.md
          - Output formats: concepts/output-formats.md
  - Guides:
      - Uploading to the Hub: guides/uploading.md
      - Checking a ConvoMem dataset: guides/checking-convomem.md
      - Topics: guides/topics.md
  - Reference:
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
      - Changelog: reference/changelog.md
      - How this repo is built: reference/factory.md
      - Development: reference/development.md
      - Limitations: reference/limitations.md
