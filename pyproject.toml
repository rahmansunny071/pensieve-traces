[project]
name = "pensieve-traces"
version = "0.0.0"
description = "Turn coding-agent session traces (Claude Code first) into Hugging Face STS traces, OpenRouter Broadcast traces and ConvoMem-style memory datasets."
readme = "README.md"
authors = [{ name = "Sajjadur Rahman", email = "rahmansunny071@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
redact = ["teich>=0.3.8,<0.4"]
hub = ["huggingface_hub>=1.0,<3"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
pensieve-traces = "pensieve_traces.cli:main"

[project.urls]
Homepage = "https://sajjadur.net/"
Repository = "https://github.com/rahmansunny071/pensieve-traces"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pensieve_traces"]

[tool.ruff]
line-length = 100
